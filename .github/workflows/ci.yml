name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build PAMFlow
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcode-select -p
          xcodebuild -version

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project PAMFlow.xcodeproj \
            -scheme PAMFlow

      - name: Build
        run: |
          xcodebuild \
            -project PAMFlow.xcodeproj \
            -scheme PAMFlow \
            -configuration Debug \
            -destination 'platform=macOS' \
            build
