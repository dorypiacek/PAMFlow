name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build PAMFlow
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcode-select -p
          xcodebuild -version

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project PAMFlow.xcodeproj \
            -scheme PAMFlow

      - name: Build Swift packages
        run: |
          swift build --package-path Core
          swift build --package-path UI
          swift build --package-path Modules/PAM
          swift build --package-path Modules/BRUV

      - name: Build app
        run: |
          xcodebuild \
            -project PAMFlow.xcodeproj \
            -scheme PAMFlow \
            -configuration Debug \
            -destination 'platform=macOS' \
            build

      - name: Build PAM-only app variant
        run: |
          xcodebuild \
            -project PAMFlow.xcodeproj \
            -scheme PAMFlow \
            -configuration Debug \
            -destination 'platform=macOS' \
            'SWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited) PAMFLOW_CUSTOM_MODULE_SELECTION PAMFLOW_INCLUDE_PAM' \
            build

      - name: Build BRUV/RUV-only app variant
        run: |
          xcodebuild \
            -project PAMFlow.xcodeproj \
            -scheme PAMFlow \
            -configuration Debug \
            -destination 'platform=macOS' \
            'SWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited) PAMFLOW_CUSTOM_MODULE_SELECTION PAMFLOW_INCLUDE_BRUV' \
            build
